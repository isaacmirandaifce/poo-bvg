<svg width="680" height="520" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama UML — SecureBank Pro</title>
<desc>Classes ContaBancaria e Transacao com modificadores de acesso e relacao de amizade com validarTransacao</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="520" fill="white"/>

<!-- ContaBancaria -->
<rect x="40" y="60" width="240" height="200" rx="8" fill="white" stroke="#aaa" stroke-width="1"/>
<rect x="40" y="60" width="240" height="40" rx="0" fill="#f0f0f0" stroke="none"/>
<rect x="40" y="60" width="240" height="40" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1" clip-path="inset(0 0 10 0)"/>
<text font-family="monospace" font-size="14" font-weight="bold" x="160" y="85" text-anchor="middle" dominant-baseline="central">ContaBancaria</text>
<line x1="40" y1="100" x2="280" y2="100" stroke="#aaa" stroke-width="1"/>
<text font-family="monospace" font-size="12" x="56" y="120" dominant-baseline="central">- titular : string</text>
<text font-family="monospace" font-size="12" x="56" y="140" dominant-baseline="central">- cpf : string</text>
<text font-family="monospace" font-size="12" fill="#c97a00" x="56" y="160" dominant-baseline="central"># saldo : double</text>
<line x1="40" y1="175" x2="280" y2="175" stroke="#aaa" stroke-width="1"/>
<text font-family="monospace" font-size="12" x="56" y="195" dominant-baseline="central">+ ContaBancaria(titular, cpf, saldo)</text>
<text font-family="monospace" font-size="12" x="56" y="215" dominant-baseline="central">+ exibirDados() : void</text>
<text font-family="monospace" font-size="12" fill="#1a73e8" x="56" y="240" dominant-baseline="central">«friend» validarTransacao()</text>

<!-- Transacao -->
<rect x="400" y="60" width="240" height="200" rx="8" fill="white" stroke="#aaa" stroke-width="1"/>
<rect x="400" y="60" width="240" height="40" rx="8" fill="#f0f0f0" stroke="#aaa" stroke-width="1"/>
<text font-family="monospace" font-size="14" font-weight="bold" x="520" y="85" text-anchor="middle" dominant-baseline="central">Transacao</text>
<line x1="400" y1="100" x2="640" y2="100" stroke="#aaa" stroke-width="1"/>
<text font-family="monospace" font-size="12" x="416" y="120" dominant-baseline="central">- valor : double</text>
<text font-family="monospace" font-size="12" x="416" y="140" dominant-baseline="central">- data : string</text>
<line x1="400" y1="155" x2="640" y2="155" stroke="#aaa" stroke-width="1"/>
<text font-family="monospace" font-size="12" x="416" y="175" dominant-baseline="central">+ Transacao(valor, data)</text>
<text font-family="monospace" font-size="12" x="416" y="195" dominant-baseline="central">+ exibirDados() : void</text>
<text font-family="monospace" font-size="12" fill="#1a73e8" x="416" y="220" dominant-baseline="central">«friend» validarTransacao()</text>

<!-- validarTransacao function box -->
<rect x="215" y="370" width="250" height="76" rx="8" stroke="#888" stroke-width="1" stroke-dasharray="6 3" fill="#f8f8f8"/>
<text font-family="monospace" font-size="12" fill="#555" x="340" y="393" text-anchor="middle" dominant-baseline="central">«friend function»</text>
<text font-family="monospace" font-size="13" font-weight="bold" x="340" y="413" text-anchor="middle" dominant-baseline="central">validarTransacao</text>
<text font-family="monospace" font-size="11" x="340" y="433" text-anchor="middle" dominant-baseline="central">(ContaBancaria&amp;, Transacao&amp;) : bool</text>

<!-- Arrows -->
<line x1="160" y1="260" x2="260" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<line x1="520" y1="260" x2="420" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Legend -->
<rect x="40" y="460" width="600" height="44" rx="8" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
<text font-family="monospace" font-size="12" x="56" y="482" dominant-baseline="central">- privado</text>
<text font-family="monospace" font-size="12" fill="#c97a00" x="150" y="482" dominant-baseline="central"># protegido</text>
<text font-family="monospace" font-size="12" x="270" y="482" dominant-baseline="central">+ público</text>
<text font-family="monospace" font-size="12" fill="#1a73e8" x="380" y="482" dominant-baseline="central">«friend» função amiga</text>
<text font-family="monospace" font-size="11" fill="#555" x="56" y="497" dominant-baseline="central">- - -  relação de amizade (acesso especial a membros privados/protected)</text>
</svg>
